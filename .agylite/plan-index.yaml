- phase_id: P5
  phase_name: 'Content: question bank & clues'
  status: COMPLETED
  objective: Shared round-1 QRs so more than 10 teams fit the same 48 places (D-039) and a Game over pop-up for everyone (D-040),
    then a hand-written question bank and the location clues for the real venue.
  active_tasks:
  - T-503
  tasks:
  - id: T-501
    title: Questions CRUD + filters + CSV import with per-row report
    status: COMPLETED
  - id: T-502
    title: 'Seed bank: ≥ 300 hand-written questions, **simple to answer** and mixed: technical (simple coding: "what does
      this print?", fix-the-bug, output of a loop; basic tech facts) and non-technical (GK, history, geography, funny), **meme-style
      riddles**, humour general and clean with **no campus in-jokes** (D-036), not tied to any place: a correct answer unlocks
      a piece of the clue to the team''s next place, as multiple choice (4 options), one word and number. Difficulty 1–5 (rises
      gently by round), each typed one with alternatives + hint'
    status: COMPLETED
  - id: T-503
    title: 'Location clues for the real venue: **2–3 clue sets per place** (D-033), each 4 pieces (one per member) + a hint.
      Clues are **simple to solve** and mix plain riddles, simple tech/coding twists and meme-style lines; the 4 pieces together
      must point to one place only. **Workflow:** the user sends the places and says "continue"; I then write the exact clues
      for every place and load them. The user sends each place as **building, floor, name** (rooms by number, libraries, labs,
      canteen, boys'' hostel…). A **hiding spot** is given only for big places (e.g. a library shelf, a hostel common room,
      "behind computer 12" in a lab); a normal room has none and the room itself is the spot'
    status: COMPLETED
  - id: T-506
    title: 'New Game reshuffles the pyramid (D-033), per game panel (D-035): same places, new rounds, links, decoys and routes
      each game. Cards stay with their place (token + key kept per location), so nothing is re-hidden; master list reprinted'
    status: COMPLETED
  - id: T-507
    title: 'Clue sets per place (D-033): store 2–3 sets of 4 pieces + hint; Locations editor edits each set; each game uses
      a different set (round-robin), and teams sharing a QR in the same round get different sets where the place has enough
      (D-039), shown on Generator and the master list'
    status: COMPLETED
  - id: T-504
    title: 'Multiple choice (D-029): 4 options shuffled per player, a wrong pick swaps the question (never a repeat), no hints
      on multiple choice; mixed with one-word and number questions'
    status: COMPLETED
  - id: T-505
    title: 'Three chances (D-030): 3 wrong multiple-choice picks in a row → answering locked for the admin''s lockout (default
      2 min), then 3 fresh chances; chances row and locked countdown on Solve; lockout freezes on pause'
    status: COMPLETED
  - id: T-508
    title: 'Shared round-1 QRs (D-039): round 1 is capped at 15 QRs (pyramid for 10 teams: 15 → 9 → 6 → 4 → 3 → 2 → 1); beyond
      15 teams the generator and `apply_game_plan` drop the one-QR-per-team rule and spread teams evenly over round 1; X defaults
      scale to the team count; master list shows the teams per QR. Migration 0014 on test then prod'
    status: COMPLETED
  - id: T-509
    title: 'Game over pop-up (D-040): when the game ends (3rd team finishes or End game), every phone shows the top 3 and
      "Return to the starting point"; ranking stays by finish order; the admin checks each winner''s key on the dashboard.
      The projector''s version is T-703 (no `/screen` until P7)'
    status: COMPLETED
  - id: T-510
    title: 'Routes far apart (D-042): places get an area; consecutive places on a route are never in the same area (Main
      Block and outside alternate), farthest by map pin preferred; apply_game_plan re-validates; area field in the Locations
      editor'
    status: COMPLETED
  - id: T-511
    title: 'Placement stub (D-043): place number, building, floor, landmark on locations; each QR card''s cut-off strip shows
      where it goes and says to cut it off and throw it away; same details in the admin panel; checked in P8'
    status: COMPLETED
