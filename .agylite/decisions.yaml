  decision: Database security and RPC tests run as Vitest integration tests against a separate Supabase test project; a bot
    simulator (scripts/simulate.ts) plays full games with N teams of 4 bots
  reason: Same approach as AI Musical Chair (D-013, T-801)
  alternatives: []
  impact: ''
