  decision: Prod = existing project vwkggtlrypmhlhifveob ('vcc41238@gmail.com's Project'); test = crypto-hunt-test ljvgprlnbufbgcdwrupf;
    both ap-south-1 (Mumbai), free plan
  reason: Free plan allows 2 active projects; the existing one was empty and created for this; Mumbai is closest to players
