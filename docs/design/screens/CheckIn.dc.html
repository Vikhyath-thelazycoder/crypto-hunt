          <div style="font-size: 15px; font-weight: 600; color: #8E1B1B">You</div>

    <div style="flex: 1"></div>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #5E3D20">Your seal completes the round for the whole crew.</p>
    <button class="wax" type="button" style="height: 62px; border-radius: 14px; font-size: 22px">Press my seal</button>
  </div>
</main>
