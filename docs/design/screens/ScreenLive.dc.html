<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crypto Hunt · Projector live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0805}
.fell{font-family:'IM Fell English SC',Georgia,serif;font-weight:400}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.ship{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%) rotateX(-40deg);transform-origin:50% 100%}
.flag{margin-top:2px;padding:3px 12px;border-radius:6px;font-family:'IM Fell English SC',serif;font-size:26px;white-space:nowrap;color:#F7E9C8;background:rgba(18,12,7,.82);box-shadow:0 0 0 1px rgba(226,190,114,.5),0 8px 14px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:22px;height:80px;padding:0 26px;border-radius:14px;background:linear-gradient(180deg,rgba(255,232,180,.09),rgba(255,232,180,.03));box-shadow:inset 0 0 0 1px rgba(226,190,114,.22)}
.row.top{background:linear-gradient(180deg,rgba(226,190,114,.3),rgba(184,138,30,.12));box-shadow:inset 0 0 0 2px rgba(233,199,102,.75),0 14px 30px -14px rgba(255,190,80,.45)}
.row.out{height:58px;opacity:.55;background:none;box-shadow:inset 0 -1px 0 rgba(226,190,114,.15)}
.pip{width:16px;height:16px;transform:rotate(45deg);border-radius:2px;border:1.5px solid rgba(226,190,114,.55)}
.pip.on{border:0;background:linear-gradient(135deg,#FFF1B8,#C99A2E 60%,#7A5A12)}
</style>
</helmet>
<main style="position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Spectral', Georgia, serif; color: #F3E6C8; background: radial-gradient(900px 700px at 30% 60%, #3A2814 0%, #1A120A 55%, #0B0805 100%)">
  <div aria-hidden="true" style="position: absolute; left: -200px; top: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,170,70,.18), transparent)"></div>
  <div aria-hidden="true" style="position: absolute; right: -150px; bottom: -250px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,170,70,.12), transparent)"></div>

  <header style="position: absolute; left: 80px; top: 54px; right: 80px; display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <div class="fell" style="font-size: 30px; letter-spacing: .3em; color: #E2BE72">CRYPTO HUNT · LIVE</div>
      <h1 class="fell" style="margin: 0; font-size: 132px; line-height: .9; color: #FBE7B0; text-shadow: 0 0 40px rgba(255,180,80,.35), 0 4px 0 rgba(0,0,0,.6)">Round IV</h1>
    </div>
    <div style="text-align: right">
      <div style="font-size: 40px; color: #E8D6B0">Four crews advance</div>
      <div style="display: flex; gap: 18px; justify-content: flex-end; margin-top: 12px">
        <div style="width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #D2564A, #8E1B1B 50%, #4E0B0B); box-shadow: inset 0 -4px 8px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.6)"></div>
        <div style="width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #D2564A, #8E1B1B 50%, #4E0B0B); box-shadow: inset 0 -4px 8px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.6)"></div>
        <div style="width: 66px; height: 66px; border-radius: 50%; border: 3px dashed rgba(226,190,114,.55); box-sizing: border-box"></div>
        <div style="width: 66px; height: 66px; border-radius: 50%; border: 3px dashed rgba(226,190,114,.55); box-sizing: border-box"></div>
      </div>
    </div>
  </header>

  <section aria-label="Map of the venue with each crew's ship" style="position: absolute; left: 40px; top: 300px; width: 1060px; height: 700px; perspective: 1500px; perspective-origin: 50% 0%">
    <div style="position: absolute; left: 50px; top: 10px; width: 960px; height: 720px; transform: rotateX(40deg); transform-origin: 50% 100%; transform-style: preserve-3d">
      <div style="position: absolute; inset: 0; border-radius: 6px; box-shadow: 0 6px 0 #6E4A2A, 0 12px 0 #3E2510, 0 60px 80px rgba(0,0,0,.85)"></div>
      <svg viewBox="30 30 740 550" preserveAspectRatio="none" width="960" height="720" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 6px">
        <defs>
          <radialGradient id="land" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#F3E7C6"></stop><stop offset=".7" stop-color="#E4D0A2"></stop><stop offset="1" stop-color="#C9AA70"></stop></radialGradient>
          <radialGradient id="edge" cx="50%" cy="50%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#2A1408" stop-opacity=".55"></stop></radialGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A8C8E"></stop><stop offset="1" stop-color="#2F5D62"></stop></linearGradient>
          <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2A1D12" stroke-width="1" opacity=".5"></line></pattern>
          <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r=".9" fill="#6E4A2A" opacity=".6"></circle></pattern>
        </defs>
        <rect x="0" y="0" width="800" height="600" fill="#CDB07A"></rect>
        <path d="M60,70 C200,40 420,55 560,48 C660,44 740,70 752,140 C764,260 748,400 738,500 C730,548 640,566 520,560 L240,562 C130,566 62,540 52,460 C40,340 46,190 60,70 Z" fill="url(#land)" stroke="#2A1D12" stroke-width="2.4"></path>
        <path d="M120,380 C160,350 230,360 250,400 C270,440 240,490 190,494 C130,498 90,470 92,430 C94,410 104,392 120,380 Z" fill="url(#water)" stroke="#2A1D12" stroke-width="1.6"></path>
        <path d="M396,560 C400,520 440,505 462,492 M465,430 C450,390 422,360 418,325 M500,282 C540,286 562,300 592,320 M500,246 C520,222 530,208 540,198 M640,148 C640,200 650,240 655,270 M330,280 C290,300 260,320 240,360 M330,250 C290,220 260,190 240,170" fill="none" stroke="#6E4A2A" stroke-width="1.4" stroke-dasharray="3 4"></path>
        <g transform="rotate(-4 195 135)"><rect x="125" y="100" width="140" height="70" fill="#DCC69A" stroke="#2A1D12" stroke-width="1.8"></rect><rect x="125" y="100" width="140" height="70" fill="url(#hatch)"></rect></g>
        <rect x="570" y="70" width="160" height="78" rx="38" fill="#C9C695" stroke="#2A1D12" stroke-width="1.6"></rect>
        <rect x="330" y="230" width="170" height="95" fill="#DCC69A" stroke="#2A1D12" stroke-width="1.8"></rect><rect x="330" y="230" width="170" height="95" fill="url(#hatch)"></rect>
        <g transform="rotate(-3 465 460)"><rect x="400" y="430" width="130" height="60" fill="#DCC69A" stroke="#2A1D12" stroke-width="1.8"></rect><rect x="400" y="430" width="130" height="60" fill="url(#hatch)"></rect></g>
        <rect x="520" y="150" width="46" height="46" fill="#DCC69A" stroke="#2A1D12" stroke-width="1.8"></rect><circle cx="543" cy="173" r="11" fill="#F3E7C6" stroke="#2A1D12" stroke-width="1.4"></circle>
        <rect x="590" y="272" width="130" height="118" fill="url(#dots)" stroke="#2A1D12" stroke-width="1.4" stroke-dasharray="5 3"></rect>
        <g fill="#7C8A55" stroke="#2A1D12" stroke-width="1"><circle cx="560" cy="470" r="9"></circle><circle cx="578" cy="488" r="11"></circle><circle cx="690" cy="200" r="10"></circle><circle cx="300" cy="150" r="10"></circle><circle cx="318" cy="168" r="8"></circle><circle cx="680" cy="450" r="10"></circle><circle cx="270" cy="260" r="9"></circle><circle cx="96" cy="250" r="10"></circle></g>
        <g font-family="IM Fell English SC, serif" fill="#2A1D12" text-anchor="middle" font-size="20">
          <text x="195" y="192">Old Library</text><text x="415" y="350">Great Hall</text><text x="465" y="514">Canteen</text><text x="543" y="218">Clock Tower</text><text x="650" y="62">The Field</text><text x="655" y="414">East Court</text><text x="172" y="518">The Lake</text>
        </g>
        <g transform="translate(110 520)"><circle r="34" fill="#F3E7C6" stroke="#2A1D12" stroke-width="1.4"></circle><path d="M0,-30 L6,0 L0,4 L-6,0Z" fill="#8E1B1B"></path><path d="M0,30 L6,0 L0,-4 L-6,0Z" fill="#2A1D12"></path><path d="M-30,0 L0,5 L4,0 L0,-5Z" fill="#6E4A2A"></path><path d="M30,0 L0,5 L-4,0 L0,-5Z" fill="#6E4A2A"></path></g>
        <rect x="0" y="0" width="800" height="600" fill="url(#edge)"></rect>
      </svg>

      <sc-for list="{{ships}}" as="s" hint-placeholder-count="6">
        <div class="ship" style="left: {{s.x}}; top: {{s.y}}">
          <svg width="70" height="70" viewBox="0 0 64 64" aria-hidden="true" style="filter: drop-shadow(0 10px 6px rgba(0,0,0,.55))">
            <path d="M31 6 V44" stroke="#3E2510" stroke-width="2.5"></path>
            <path d="M31 9 C42 14 46 26 44 38 L31 38 Z" fill="#F6EBD0" stroke="#6E4A2A" stroke-width="1"></path>
            <path d="M29 12 C21 18 19 28 21 36 L29 36 Z" fill="#E4D2A8" stroke="#6E4A2A" stroke-width="1"></path>
            <path d="M31 6 L42 9 L31 12 Z" fill="{{s.c}}"></path>
            <path d="M8 42 H56 L50 54 C40 58 24 58 14 54 Z" fill="#5A3417" stroke="#2A160A" stroke-width="1.2"></path>
            <path d="M12 46 H52" stroke="#8A5428" stroke-width="1.4"></path>
          </svg>
          <span class="flag" style="border-bottom: 4px solid {{s.c}}">{{s.name}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-label="Leaderboard" style="position: absolute; right: 80px; top: 300px; width: 700px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{board}}" as="r" hint-placeholder-count="10">
      <div class="{{r.cls}}">
        <span class="fell" style="width: 54px; font-size: 52px; line-height: 1; color: #E2BE72">{{r.rank}}</span>
        <span class="fell" style="flex: 1; min-width: 0; font-size: 48px; line-height: 1; color: #FBF0D2; white-space: nowrap">{{r.name}}</span>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
          <div style="display: flex; gap: 9px">
            <sc-for list="{{r.pips}}" as="p" hint-placeholder-count="7"><span class="{{p}}"></span></sc-for>
          </div>
          <span style="font-size: 26px; color: #D9C39A">{{r.phase}}</span>
        </div>
      </div>
    </sc-for>
  </section>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; display: flex; align-items: center; gap: 30px; padding: 0 80px; background: linear-gradient(180deg, #F6E6B0 0%, #C99A2E 45%, #8A6414 100%); box-shadow: 0 -10px 30px rgba(0,0,0,.6); color: #2A1D12">
    <span class="fell" style="font-size: 30px; letter-spacing: .14em; color: #5A0E0E">LATEST</span>
    <span style="font-size: 32px; font-weight: 600">Black Tide sealed Round IV · Copper Owls lifted the fog · Night Herons serving a 4:00 penalty</span>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const pips = (n) => Array.from({ length: 7 }, (_, i) => (i < n ? 'pip on' : 'pip'));
    const board = [
      { rank: 'I', name: 'Salt Wolves', phase: 'Round V · solving', pips: pips(4), cls: 'row top' },
      { rank: 'II', name: 'Black Tide', phase: 'Round V · solving', pips: pips(4), cls: 'row top' },
      { rank: 'III', name: 'Iron Gulls', phase: 'Checking in 3/4', pips: pips(3), cls: 'row' },
      { rank: 'IV', name: 'Night Herons', phase: 'Penalty 1:12', pips: pips(3), cls: 'row' },
      { rank: 'V', name: 'Copper Owls', phase: 'Seeking the mark', pips: pips(3), cls: 'row' },
      { rank: 'VI', name: 'Rust Anchors', phase: 'Solving 2/3', pips: pips(3), cls: 'row' },
      { rank: '', name: 'Ember Crows · Grey Moths', phase: 'out in III', pips: [], cls: 'row out' },
      { rank: '', name: 'Pale Foxes · Stone Eels', phase: 'out in II', pips: [], cls: 'row out' }
    ];
    const ships = [
      { name: 'Salt Wolves', x: '69%', y: '27%', c: '#E9C766' },
      { name: 'Black Tide', x: '22%', y: '20%', c: '#5FA3A8' },
      { name: 'Iron Gulls', x: '84%', y: '55%', c: '#C9493C' },
      { name: 'Night Herons', x: '84%', y: '14%', c: '#9DBE7E' },
      { name: 'Copper Owls', x: '52%', y: '46%', c: '#E0915A' },
      { name: 'Rust Anchors', x: '58%', y: '80%', c: '#B9B2D6' }
    ];
    return { board, ships };
  }
}
</script>
</body>
</html>
