<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crypto Hunt · Hint penalty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8E1B1B}a:hover{color:#5A0E0E}
.fell{font-family:'IM Fell English SC',Georgia,serif;font-weight:400}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.paper{background:radial-gradient(120% 70% at 50% 34%,#F8F0DA 0%,#EFE3C4 38%,#E5D2A8 70%,#CFB27C 100%)}
.seal{display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:'IM Fell English SC',Georgia,serif;color:#F6E2C6;background:radial-gradient(circle at 32% 28%,#C9493C 0%,#8E1B1B 46%,#560D0D 100%);box-shadow:inset 0 0 0 3px rgba(60,6,6,.35),inset 0 2px 2px rgba(255,200,170,.35),inset 0 -3px 6px rgba(0,0,0,.4),0 3px 6px rgba(42,20,10,.45);text-shadow:0 1px 0 rgba(0,0,0,.45)}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: 'Spectral', Georgia, serif; color: #2A1D12" class="paper">
  <svg aria-hidden="true" width="390" height="844" style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .38">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .29  0 0 0 0 .16  0 0 0 .5 0"></feColorMatrix></filter>
    <rect width="390" height="844" filter="url(#grain)"></rect>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 24px; box-sizing: border-box; height: 100%">
    <header style="align-self: stretch; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="seal" style="width: 42px; height: 42px; font-size: 17px">IG</div>
        <div>
          <div class="fell" style="font-size: 19px; line-height: 1.1">Iron Gulls</div>
          <div class="mono" style="font-size: 12px; color: #5E3D20; letter-spacing: .08em">ALL 4 SEALED</div>
        </div>
      </div>
      <div style="text-align: right">
        <div class="fell" style="font-size: 12px; letter-spacing: .2em; color: #5E3D20">ROUND</div>
        <div class="fell" style="font-size: 30px; line-height: .9">III<span style="font-size: 16px; color: #6E4A2A"> / VII</span></div>
      </div>
    </header>

    <p class="fell" style="margin: 12px 0 0; font-size: 16px; letter-spacing: .34em; color: #8E1B1B">PENALTY</p>

    <svg viewBox="0 0 200 280" width="176" height="246" role="img" aria-label="Hourglass, about forty percent of the sand left" style="filter: drop-shadow(0 22px 18px rgba(42,20,10,.45))">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C08A4E"></stop><stop offset=".45" stop-color="#7A4A22"></stop><stop offset="1" stop-color="#3C220E"></stop></linearGradient>
        <linearGradient id="woodtop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A3417"></stop><stop offset=".35" stop-color="#C79358"></stop><stop offset=".55" stop-color="#E2B57A"></stop><stop offset="1" stop-color="#4A2A12"></stop></linearGradient>
        <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4E370A"></stop><stop offset=".35" stop-color="#F4DE9C"></stop><stop offset=".6" stop-color="#B88A1E"></stop><stop offset="1" stop-color="#4E370A"></stop></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".1"></stop><stop offset=".22" stop-color="#FFFFFF" stop-opacity=".55"></stop><stop offset=".4" stop-color="#FFFFFF" stop-opacity=".08"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity=".22"></stop></linearGradient>
        <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9782C"></stop><stop offset=".4" stop-color="#E6BC68"></stop><stop offset="1" stop-color="#9A6A22"></stop></linearGradient>
      </defs>
      <ellipse cx="100" cy="262" rx="88" ry="12" fill="url(#wood)"></ellipse>
      <rect x="12" y="246" width="176" height="16" fill="url(#woodtop)"></rect>
      <ellipse cx="100" cy="246" rx="88" ry="12" fill="#D9A86C"></ellipse>
      <rect x="28" y="30" width="9" height="216" rx="4" fill="url(#post)"></rect>
      <rect x="163" y="30" width="9" height="216" rx="4" fill="url(#post)"></rect>
      <path d="M50,32 C50,90 92,112 96,140 C92,168 50,190 50,246 L150,246 C150,190 108,168 104,140 C108,112 150,90 150,32 Z" fill="#F7EBD0" fill-opacity=".35" stroke="#6E4A2A" stroke-opacity=".5" stroke-width="1.2"></path>
      <path d="M72,82 C82,98 94,110 98,132 L102,132 C106,110 118,98 128,82 Z" fill="url(#sand)"></path>
      <path d="M99.2,132 L100.8,132 L100.8,218 L99.2,218 Z" fill="#C99A48"></path>
      <path d="M56,246 C58,218 84,200 100,198 C116,200 142,218 144,246 Z" fill="url(#sand)"></path>
      <path d="M50,32 C50,90 92,112 96,140 C92,168 50,190 50,246 L150,246 C150,190 108,168 104,140 C108,112 150,90 150,32 Z" fill="url(#glass)"></path>
      <path d="M60,44 C60,80 76,98 86,110" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"></path>
      <path d="M60,236 C62,206 74,190 84,180" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"></path>
      <ellipse cx="100" cy="30" rx="88" ry="12" fill="url(#wood)"></ellipse>
      <rect x="12" y="14" width="176" height="16" fill="url(#woodtop)"></rect>
      <ellipse cx="100" cy="14" rx="88" ry="12" fill="#D9A86C"></ellipse>
      <ellipse cx="100" cy="14" rx="70" ry="8" fill="none" stroke="#7A4A22" stroke-width="1"></ellipse>
    </svg>

    <div role="timer" aria-live="off" class="fell" style="font-size: 96px; line-height: .9; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(255,255,255,.5), 0 10px 22px rgba(42,29,18,.2)">1:42</div>
    <div style="width: 260px; height: 10px; border-radius: 5px; background: rgba(110,74,42,.2); box-shadow: inset 0 1px 2px rgba(42,29,18,.35); overflow: hidden">
      <div style="width: 58%; height: 100%; border-radius: 5px; background: linear-gradient(180deg, #F4DE9C, #B88A1E 60%, #7A5A12)"></div>
    </div>
    <p style="margin: 0; font-size: 16px; color: #5E3D20; text-align: center">Your crew is sealed in. The round counts<br>when the sand runs out.</p>

    <div style="flex: 1"></div>
    <section aria-label="Hints used" style="align-self: stretch; border-radius: 16px; padding: 6px 16px; background: linear-gradient(180deg, rgba(42,29,18,.07), rgba(42,29,18,.02)); box-shadow: inset 0 0 0 1px rgba(110,74,42,.3)">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(110,74,42,.22)">
        <span style="font-size: 16px"><b>Meera</b> took a hint · Round III</span><span class="mono" style="font-size: 15px; font-weight: 600; color: #8E1B1B">+2:00</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(110,74,42,.22)">
        <span style="font-size: 16px"><b>Ravi</b> took a hint · Round III</span><span class="mono" style="font-size: 15px; font-weight: 600; color: #8E1B1B">+2:00</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0">
        <span class="fell" style="font-size: 16px; letter-spacing: .1em">Total this round</span><span class="mono" style="font-size: 17px; font-weight: 600">4:00</span>
      </div>
    </section>
  </div>
</main>
</x-dc>

</body>
</html>
